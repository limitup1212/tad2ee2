# إعدادات تطبيق تدقيق الكشوف
# يمكن تعديل هذا الملف بأي محرر نصوص ثم إعادة تحميل الصفحة.

verification:
  tax_rate: "0.05"          # نسبة الضريبة
  rounding_unit: "10000"    # التقريب للأعلى إلى أقرب 10,000
  tax_tolerance: "0"        # فرق مسموح بين الرقم 2 والضريبة الدقيقة قبل التنبيه

extraction:
  # النموذج المحلي (يعمل عبر Ollama على هذا الجهاز فقط — لا تُرسل الصور إلى الإنترنت)
  #   qwen3-vl:4b-instruct  أسرع، مناسب لجهاز بدون كرت شاشة
  #   qwen3-vl:8b-instruct  أدق وأبطأ، يحتاج ذاكرة أكبر
  model: qwen3-vl:4b-instruct
  max_image_side: 2400      # تصغير الصورة قبل القراءة (بكسل للضلع الأطول)
  num_ctx: 4096
  # القراءة على شرائط: تُقطع الصورة إلى شرائط أفقية ارتفاع كل منها = العرض ÷ الرقم.
  # رقم أكبر = شرائط أكثر وأصغر = أرقام أوضح للنموذج لكن وقت أطول. 0 = الصفحة كاملة دفعة واحدة.
  strip_ratio: 1.5          # للكشوف (1.5 = صفحة A4 على جزأين تقريباً)
  summary_strip_ratio: 1.5  # لصفحة الخلاصة
  # وصف اختياري لشكل الكشف يساعد النموذج، مثال:
  # sheet_hint: "العمود الأول من اليمين هو التسلسل، ثم الاسم (تجاهله)، ثم المبلغ، ثم التاريخ"
  sheet_hint: ""
  summary_hint: ""

form:
  template: templates/form_template.xlsx   # ملف النموذج (xlsx)
  sheet: null                              # اسم الورقة داخل الملف، أو null لأول ورقة
  # كل قيمة ← الخلية التي تُكتب فيها. احذف السطر لتجاهل القيمة.
  cells:
    name: C3          # الاسم
    serial_from: C4   # أول تسلسل
    serial_to: E4     # آخر تسلسل
    date: C5          # التاريخ
    month: E5         # الشهر
    total: C7         # الرقم 1 — المجموع
    tax: C8           # الرقم 2 — الضريبة
    rounding: C9      # الرقم 3 — فرق التقريب (تبقى فارغة عند وجود 3 أرقام فقط)
    stamp: C10        # الطابع
    notes: B12        # الملاحظات
